name: CI/CD Pipeline — TMDB App

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # --- ETAPA 1: testes ---
  test:
    name: 'Testes Automatizados'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout do Código'
        uses: actions/checkout@v4

      - name: 'Configurar Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 'Instalar Dependências'
        run: npm ci

      - name: 'Executar Testes'
        run: npm test -- --watchAll=false --passWithNoTests

  # --- ETAPA 2: DEPLOY WEB ---
  deploy-web:
    name: 'Deploy GitHub Pages'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Expo env file
        run: |
          printf 'EXPO_PUBLIC_TMDB_API_KEY=%s\n' '${{ secrets.TMDB_API_KEY }}' > .env

      - name: Build web export
        run: npx expo export --platform web

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # --- ETAPA 3: build e release ---
  build-android:
    name: 'Build Android APK'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout do Código'
        uses: actions/checkout@v4

      - name: ' Configurar JDK 17'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'Configurar Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 'Instalar Dependências'
        run: npm ci

      - name: 'Expo Prebuild'
        run: npx expo prebuild --platform android

      - name: 'Permissão no Gradlew'
        run: chmod +x android/gradlew

      - name: 'Gerar APK (Release)'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: 'Upload APK Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

  create-release:
    name: 'Criar GitHub Release'
    needs: [deploy-web, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout do Código'
        uses: actions/checkout@v4

      - name: 'Baixar APK'
        uses: actions/download-artifact@v4
        with:
          name: app-release

      - name: 'Criar Release Oficial'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Release automática gerada pelo pipeline de CI/CD.
            - Build Android (APK) incluído.
            - Deploy Web atualizado no GitHub Pages.
          files: app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}